[package]
name = "krawall"
version = "0.1.1"
edition = "2021"
authors = ["The gbakit Authors"]
description = "Pure Rust, zero-dependency parser, software synthesizer, and golden-tested emulator for the Krawall GBA Tracker Sound Engine (Game Boy Advance)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jidoughost-tl/krawall-rs"
keywords = ["gba", "krawall", "tracker", "audio", "synthesizer"]
categories = ["multimedia::audio", "emulators", "no-std"]

[dependencies]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
